name: deploy

# Zero-maintenance CI/CD. One workflow ships the proxy to BOTH hosts from here,
# so the repo can stay private + org-owned (Netlify's git integration refuses
# those — we deploy via the Netlify CLI instead, no repo connection needed).
# Each deploy job self-skips when its secrets are absent, so the workflow stays
# green whether you run one host or both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup@v4 reads the version
      # from package.json's `packageManager` field (single source of truth).
      # Passing both errors out with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:cloudflare

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup@v4 reads the version
      # from package.json's `packageManager` field (single source of truth).
      # Passing both errors out with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      # Deploys only if CLOUDFLARE_API_TOKEN is set in repo secrets; otherwise
      # this step is skipped so the workflow stays green on a Netlify-only setup.
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The runtime secret's VALUE, read by the `secrets:` upload below. Lives
          # only as a GitHub Actions secret — never in wrangler.toml or the repo.
          NITRO_PROXY_SECRET: ${{ secrets.NITRO_PROXY_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploads the Worker's runtime secret on every deploy (runs
          # `wrangler secret put NITRO_PROXY_SECRET` with the env value above), so
          # you never need a locally-authenticated wrangler. Set the
          # NITRO_PROXY_SECRET repo Actions secret = the backend's PROXY_SECRET; an
          # empty value uploads an empty secret (open mode — dev only).
          secrets: |
            NITRO_PROXY_SECRET

  deploy-netlify:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploys via the Netlify CLI (not git integration), so the private,
      # org-owned repo is fine. We use `--build`, NOT a pre-built `--dir=dist`:
      # the CLI runs netlify.toml's [build] command (`mkdir -p dist && pnpm
      # build:netlify`) inside its OWN build pipeline, which is the step that
      # detects Nitro's edge function in `.netlify/edge-functions/` and ships it.
      # A plain `--dir=dist` deploy uploads only the static publish dir and skips
      # the edge function (the CLI's own scan looks in `netlify/edge-functions/`,
      # not Nitro's generated `.netlify/edge-functions/`) -> every route 404s.
      # Self-skips unless NETLIFY_AUTH_TOKEN is set in repo secrets.
      #
      # `--json` makes the CLI print the deploy result (incl. the live URL) to
      # stdout; we then SMOKE-TEST the deployed edge function's health endpoint so a
      # broken/empty deploy (e.g. the edge function not shipped) fails the job LOUDLY
      # instead of going green-but-dead — the exact way the earlier breakage hid.
      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          # Capture the deploy output; --json asks the CLI to print the result
          # (incl. the live URL) as JSON. Build logs may interleave depending on the
          # CLI version, so URL extraction below is tolerant.
          result=$(npx --yes netlify-cli@latest deploy --build --prod --json)
          echo "$result"
          # Pull the production URL: try strict JSON first, then a loose regex over
          # the raw output. A parse miss only skips the smoke test (warn); it never
          # fails an otherwise-good deploy.
          url=$(printf '%s' "$result" | node -e "
            const s=require('fs').readFileSync(0,'utf8');
            let u='';
            try{const d=JSON.parse(s);u=d.ssl_url||d.url||d.deploy_ssl_url||d.deploy_url||'';}catch{}
            if(!u){const m=s.match(/https:\/\/[a-z0-9.-]+\.netlify\.app/i);u=m?m[0]:'';}
            process.stdout.write(u);
          ")
          if [ -z "$url" ]; then
            echo '::warning::Could not parse the Netlify deploy URL — skipping smoke test. Verify the proxy manually.'
            exit 0
          fi
          echo "Deployed to: $url"
          # The edge function must answer the health probe (`GET /` with no target
          # returns the crimson-proxy service JSON). 404/empty => the function wasn't
          # shipped; -f makes curl exit non-zero on HTTP error so the job goes red.
          echo "Smoke-testing $url/ ..."
          body=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/")
          echo "Health: $body"
          echo "$body" | grep -q '"service":"crimson-proxy"'
