name: deploy

# Zero-maintenance CI/CD. One workflow ships the proxy to BOTH hosts from here,
# so the repo can stay private + org-owned (Netlify's git integration refuses
# those — we deploy via the Netlify CLI instead, no repo connection needed).
# Each deploy job self-skips when its secrets are absent, so the workflow stays
# green whether you run one host or both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup@v4 reads the version
      # from package.json's `packageManager` field (single source of truth).
      # Passing both errors out with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:cloudflare

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup@v4 reads the version
      # from package.json's `packageManager` field (single source of truth).
      # Passing both errors out with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      # Deploys only if CLOUDFLARE_API_TOKEN is set in repo secrets; otherwise
      # this step is skipped so the workflow stays green on a Netlify-only setup.
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The runtime secret's VALUE, read by the `secrets:` upload below. Lives
          # only as a GitHub Actions secret — never in wrangler.toml or the repo.
          NITRO_PROXY_SECRET: ${{ secrets.NITRO_PROXY_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploads the Worker's runtime secret on every deploy (runs
          # `wrangler secret put NITRO_PROXY_SECRET` with the env value above), so
          # you never need a locally-authenticated wrangler. Set the
          # NITRO_PROXY_SECRET repo Actions secret = the backend's PROXY_SECRET; an
          # empty value uploads an empty secret (open mode — dev only).
          secrets: |
            NITRO_PROXY_SECRET

  deploy-netlify:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploys via the Netlify CLI (not git integration), so the private,
      # org-owned repo is fine. We deploy in TWO explicit steps:
      #
      #   1. `netlify build`  — runs netlify.toml's [build] command (`mkdir -p dist
      #      && pnpm build:netlify`) AND, crucially, the "Edge Functions bundling"
      #      phase that turns Nitro's generated `.netlify/edge-functions/` into the
      #      deploy-ready `.netlify/edge-functions-dist/` bundle. Logs are visible.
      #   2. `netlify deploy --prod --no-build --json` — ships that build output
      #      (incl. the internal edge function) and prints clean JSON for the URL.
      #
      # Why NOT the one-shot `deploy --build --json`: combining `--build` with
      # `--json` SKIPS the build (the CLI emitted only the result JSON, no "Building
      # Nitro Server" / "Packaging Edge Functions" lines), so the edge function was
      # never generated -> empty publish dir, every route 404s, only netlify.toml in
      # the file browser. Splitting the phases guarantees the build runs and is
      # legible, and keeps the JSON URL parse clean.
      #
      # We do NOT use `--dir=dist`: that uploads only the static publish dir and
      # drops the edge function. Self-skips unless NETLIFY_AUTH_TOKEN is set.
      - name: Build for Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest build
      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          # --no-build: deploy EXACTLY the artifact the build step above produced
          # (incl. the bundled edge function) instead of letting `deploy` re-run its
          # own implicit build. `deploy` still "uploads static files, functions, and
          # edge functions" per its docs, so the internal edge function ships.
          result=$(npx --yes netlify-cli@latest deploy --prod --no-build --json)
          echo "$result"
          # Pull the production URL: strict JSON first, then a loose regex fallback.
          # A parse miss only skips the smoke test (warn); never fails a good deploy.
          url=$(printf '%s' "$result" | node -e "
            const s=require('fs').readFileSync(0,'utf8');
            let u='';
            try{const d=JSON.parse(s);u=d.ssl_url||d.url||d.deploy_ssl_url||d.deploy_url||'';}catch{}
            if(!u){const m=s.match(/https:\/\/[a-z0-9.-]+\.netlify\.app/i);u=m?m[0]:'';}
            process.stdout.write(u);
          ")
          if [ -z "$url" ]; then
            echo '::warning::Could not parse the Netlify deploy URL — skipping smoke test. Verify the proxy manually.'
            exit 0
          fi
          echo "Deployed to: $url"
          # The edge function must answer the health probe (`GET /` with no target
          # returns the crimson-proxy service JSON). 404/empty => the function wasn't
          # shipped; -f makes curl exit non-zero on HTTP error so the job goes red.
          echo "Smoke-testing $url/ ..."
          body=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/")
          echo "Health: $body"
          echo "$body" | grep -q '"service":"crimson-proxy"'
