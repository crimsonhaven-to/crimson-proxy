# Netlify deploy config. We ship via the Netlify CLI from GitHub Actions (the repo
# is private + org-owned, which Netlify's git integration refuses). The CI runs
# `netlify build` (THIS [build] command + edge-function bundling) then a separate
# `netlify deploy --no-build` — see .github/workflows/deploy.yml for why the phases
# are split (the one-shot `deploy --build --json` silently skipped the build, so the
# edge function was never generated → every route 404'd, only netlify.toml shipped).
#
# Nitro's `netlify_edge` preset writes:
#   • the edge function     -> .netlify/edge-functions/  (manifest.json + server/)
#   • the publish artifacts -> dist/_headers, dist/_redirects
# `mkdir -p dist` first because Nitro writes `dist/_headers` WITHOUT creating the
# dir (an upstream nitro quirk) — without it the build dies with ENOENT on _headers.
#
# Do NOT add a [functions] block: this is a pure EDGE function, there are no
# serverless (Lambda) functions. A [functions] directory pointing at a path Nitro
# never creates (e.g. .netlify/functions) just adds a noisy "non-existing directory"
# warning. The edge function is auto-detected from .netlify/edge-functions/manifest.json;
# it needs no [edge_functions] entry.
[build]
  command = "mkdir -p dist && pnpm build:netlify"
  publish = "dist"
