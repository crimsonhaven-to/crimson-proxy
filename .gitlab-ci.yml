# GitLab CI/CD for crimson-proxy.
#
# Zero-maintenance CI/CD. One pipeline ships the proxy to BOTH hosts, so the repo can
# stay private + group-owned (Netlify's git integration refuses those — we deploy via
# the Netlify CLI instead, no repo connection needed). Each deploy job self-skips when
# its variables are absent, so the pipeline stays green whether you run one host or both.
#
# Required CI/CD variables (Settings > CI/CD > Variables), all masked:
#   Cloudflare: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NITRO_PROXY_SECRET
#   Netlify:    NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#
# pnpm/action-setup has no GitLab equivalent; corepack reads the pnpm version from
# package.json's `packageManager` field, which was the point of that action here.

stages:
  - security
  - build
  - deploy

default:
  tags: [docker]
  image: node:24
  before_script:
    - corepack enable
    - corepack prepare --activate
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

.pnpm_install:
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - !reference [.pnpm_install, script]
    - pnpm typecheck
    - pnpm build:cloudflare

deploy-cloudflare:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: cloudflare
  script:
    - |
      if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
        echo "CLOUDFLARE_API_TOKEN is not set — skipping the Cloudflare deploy."
        exit 0
      fi
    - !reference [.pnpm_install, script]
    - pnpm build:cloudflare
    - |
      set -euo pipefail
      # wrangler-action's `secrets:` block ran `wrangler secret put` on every deploy
      # so you never need a locally-authenticated wrangler; same thing by hand here.
      # An empty value uploads an empty secret (open mode — dev only).
      printf '%s' "${NITRO_PROXY_SECRET:-}" | npx --yes wrangler secret put NITRO_PROXY_SECRET
      npx --yes wrangler deploy

deploy-netlify:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: netlify
  script:
    - |
      if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
        echo "NETLIFY_AUTH_TOKEN is not set — skipping the Netlify deploy."
        exit 0
      fi
    - !reference [.pnpm_install, script]
    # Deploys via the Netlify CLI (not git integration), so the private, group-owned
    # repo is fine. ONE integrated `netlify deploy --prod`: it runs @netlify/build
    # (the netlify.toml [build] command + "Edge Functions bundling") AND ships the
    # result in the SAME process. That single-process run is mandatory here —
    # Nitro's edge function is *framework-generated* (an "internal" edge function
    # in `.netlify/edge-functions/`), and Netlify wires those into the deploy via an
    # IN-PROCESS handoff from build -> deploy. Splitting the phases breaks it:
    #   • `deploy --no-build` skips @netlify/build, so the internal edge function is
    #     never handed over -> it 404s even though `netlify build` bundled it fine.
    #   • `deploy --build --json` / `--json` suppressed the build entirely -> same.
    # Both were tried and both 404'd; the plain one-shot is the documented path that
    # actually deploys the internal edge function.
    #
    # No `--json` (it interfered with the build) — we grep the production URL from
    # the human output instead (the *.netlify.app host WITHOUT the per-deploy hash
    # prefix). No `--dir=dist` either (that uploads only the static dir, no function).
    - |
      set -euo pipefail
      out=$(npx --yes netlify-cli@latest deploy --prod 2>&1) || { echo "$out"; exit 1; }
      echo "$out"
      url=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9-]+\.netlify\.app' | grep -v -- '--' | head -1 || true)
      if [ -z "$url" ]; then
        echo "WARNING: could not parse the Netlify production URL — skipping smoke test. Verify the proxy manually."
        exit 0
      fi
      echo "Deployed to: $url"
      # The edge function must answer the health probe (`GET /` with no target
      # returns the crimson-proxy service JSON). 404/empty => the function wasn't
      # shipped; -f makes curl exit non-zero on HTTP error so the job goes red.
      echo "Smoke-testing $url/ ..."
      body=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/")
      echo "Health: $body"
      echo "$body" | grep -q '"service":"crimson-proxy"'

# --- Dependency vulnerability scan ---------------------------------------------
# GitLab's own Dependency Scanning is Ultimate-only: every job in its template is
# gated on $GITLAB_FEATURES, which a CE instance never sets, so including it would
# quietly scan nothing. Trivy reads the committed lockfiles directly instead and
# needs no licence.
#
# Two passes on purpose. The first prints every severity for the record; only the
# second is allowed to fail, so HIGH and CRITICAL block a deploy and the rest do
# not. This scans DEPENDENCIES, not the built image: base-image OS findings are
# usually not actionable here and would wedge every deploy.
scan-deps:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy fs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

# --- Automated dependency updates ----------------------------------------------
# Dependabot does not exist here, so Renovate fills the same role: it opens one
# merge request per available update, which then runs the gate like any other MR.
#
# Runs ONLY from a pipeline schedule, and self-skips when RENOVATE_TOKEN is unset,
# so an ordinary push never triggers it and the pipeline stays green before setup.
# One-time setup: add a group CI/CD variable RENOVATE_TOKEN (a personal access
# token with the `api` scope), then create a pipeline schedule on this project.
renovate:
  stage: security
  tags: [docker]
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@crimsonhaven.to>"
    LOG_LEVEL: info
  script:
    - renovate
